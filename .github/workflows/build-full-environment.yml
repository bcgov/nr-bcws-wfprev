permissions:
  contents: read
  packages: write
  id-token: write

on:
  pull_request_target:
    types:
      - closed
    branches:
      - 'main'
      - 'release/**'
    paths:
      - ".github/workflows/**"
      - "client/**"
      - "server/**"
      - "terraform/**"
      - "db/**"
      - "!**/README.md"
      - 'lambda/report-generator/**'
  workflow_dispatch:

# One INT build+deploy at a time: overlapping applies fail on the Terraform state lock,
# and the UI must not land after a newer run's API.
# PRs closed without merging get their own group so they never displace a queued deploy.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged) && 'wfint-deploy' || github.run_id }}
  cancel-in-progress: false

jobs:
  node-build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    uses: ./.github/workflows/node-build.yml
    secrets: inherit
    with:
      COMPONENT_NAME: wfprev-gdb-extractor
      TAG: latest

  wfprev-api:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    uses: ./.github/workflows/mvn-build.yml
    secrets: inherit
    with:
      COMPONENT_NAME: wfprev-api
      TAG: latest
      COMPONENT_TYPE: server
  
  liquibase-build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    uses: ./.github/workflows/liquibase-build.yml
    secrets: inherit
    with:
      TAG: latest

  report-generator-lambda:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    uses: ./.github/workflows/report-generator-image-build.yml
    secrets: inherit
      
  terragrunt-deploy-wfint:
    uses: ./.github/workflows/terragrunt-deploy.yml
    needs: [node-build, wfprev-api, liquibase-build, report-generator-lambda]
    with:
      DEFAULT_APPLICATION_ENVIRONMENT: wfint
      IMAGE_TAG: ${{ github.sha }}
      RUN_LIQUIBASE: true
      COMMAND: apply
    secrets: inherit

  wfprev-ui:
    uses: ./.github/workflows/client-build.yml
    needs: [terragrunt-deploy-wfint]
    with:
      DEFAULT_APPLICATION_ENVIRONMENT: wfint
    secrets: inherit
    
