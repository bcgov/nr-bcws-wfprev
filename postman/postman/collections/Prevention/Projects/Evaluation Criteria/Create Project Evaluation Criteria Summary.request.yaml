scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Parse the response JSON
      const response = pm.response.json();
      
      // 1. Save the top-level evaluation summary GUID
      if (response.evaluationCriteriaSummaryGuid) {
          pm.environment.set("evaluationCriteriaSummaryGuid", response.evaluationCriteriaSummaryGuid);
          console.log("Saved evaluationCriteriaSummaryGuid:", response.evaluationCriteriaSummaryGuid);
      } else {
          console.error("evaluationCriteriaSummaryGuid not found in response:", response);
      }
      
      // 2. Save section summary and selected criteria GUIDs
      const sectionSummaries = response.evaluationCriteriaSectionSummaries || [];
      sectionSummaries.forEach(section => {
          const sectionCode = section.evaluationCriteriaSectionCode?.evaluationCriteriaSectionCode;
          const sectionGuid = section.evaluationCriteriaSectionSummaryGuid;
      
          if (sectionCode && sectionGuid) {
              const sectionKey = `evaluationCriteriaSectionSummaryGuid_${sectionCode}`;
              pm.environment.set(sectionKey, sectionGuid);
              console.log(`Saved ${sectionKey}: ${sectionGuid}`);
          }
      
          const selectedList = section.evaluationCriteriaSelected || [];
          selectedList.forEach((selected, index) => {
              const selectedGuid = selected.evaluationCriteriaSelectedGuid;
              if (selectedGuid && sectionCode) {
                  const selectedKey = `evaluationCriteriaSelectedGuid_${sectionCode}_${index}`;
                  pm.environment.set(selectedKey, selectedGuid);
                  console.log(`Saved ${selectedKey}: ${selectedGuid}`);
              }
          });
      });
      
      // 3. Status code test
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
