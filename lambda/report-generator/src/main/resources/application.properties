quarkus.application.name=Report Generator
quarkus.native.resources.includes=data/**,images/**,fonts/**,*.properties
quarkus.native.additional-build-args=--initialize-at-build-time=java.awt.desktop.QuitStrategy,-H:ReflectionConfigurationFiles=reflect-config.json

# @QuarkusTest starts a mock Lambda event server, on 8081 by default, which can already be taken
# locally. 0 picks a free port.
%test.quarkus.lambda.mock-event-server.test-port=0

# S3 (report job input and output). Region and credentials come from the Lambda environment.
# Local development points this at the S3 mock with QUARKUS_S3_ENDPOINT_OVERRIDE,
# QUARKUS_S3_PATH_STYLE_ACCESS=true and static credentials (see docker-compose.local.yml).
quarkus.s3.sync-client.type=url
quarkus.s3.devservices.enabled=false

# LOGGING
quarkus.log.file.enable=false
quarkus.log.file.path=it.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."io.quarkiverse.jasperreports.deployment".level=INFO
%prod.quarkus.log.category."net.sf.jasperreports".level=INFO
%test.quarkus.log.category."net.sf.jasperreports".level=INFO
quarkus.log.category."net.sf.jasperreports".level=INFO
quarkus.log.category."io.quarkus.deployment.steps.ReflectiveHierarchyStep".level=ERROR
