services:
  api-dev:
    build:
      context: server/wfprev-api
      dockerfile: Dockerfile.local
    profiles:
      - dev
      - dev-watch
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REPORT_GENERATOR_LAMBDA_URL: https://mock-lambda-url
      REPORT_GENERATOR_SERVICE_URL: http://mock-report-generator
      WFDM_BASE_URL: https://i1bcwsapi.nrs.gov.bc.ca/wfdm-document-management-api
      # Report exports: the S3 mock below, and the report Lambda under the runtime
      # interface emulator (profile report-lambda), whose function name is always "function".
      REPORT_EXPORT_BUCKET: wfprev-local-report-exports
      REPORT_EXPORT_S3_ENDPOINT: http://report-exports-s3:9090
      REPORT_EXPORT_S3_PUBLIC_ENDPOINT: http://localhost:9090
      REPORT_GENERATOR_FUNCTION_NAME: function
      REPORT_GENERATOR_LAMBDA_ENDPOINT: http://report-lambda:8080
    volumes:
      - ./server/wfprev-api/target:/app/target
    depends_on:
      db:
        condition: service_healthy

  # S3 stand-in for report exports. Download links are signed for http://localhost:9090.
  report-exports-s3:
    image: adobe/s3mock:5.2.3
    profiles:
      - dev
      - dev-watch
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: wfprev-local-report-exports
    ports:
      - "9090:9090"
    networks:
      - wfprev-network

  # The report Lambda (native build, several minutes) under the Lambda runtime interface
  # emulator, reading and writing the S3 mock. Needed for Fiscal and RESULTS XLSX exports:
  #   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile dev --profile report-lambda up
  report-lambda:
    build:
      context: lambda/report-generator
      dockerfile: src/main/docker/Dockerfile.lambda
    profiles:
      - report-lambda
    entrypoint: ["/aws-lambda-rie", "/var/task/bootstrap"]
    environment:
      REPORT_EXPORT_BUCKET: wfprev-local-report-exports
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://report-exports-s3:9090
      QUARKUS_S3_PATH_STYLE_ACCESS: "true"
      QUARKUS_S3_AWS_REGION: ca-central-1
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: local
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: local
    volumes:
      - ./lambda/report-generator/aws-lambda-rie:/aws-lambda-rie:ro
    networks:
      - wfprev-network

  db:
    image: postgis/postgis:17-3.4
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d
      - ./wfprev.dump:/dump/wfprev.dump
    environment:
      - SKIP_RESTORE=${SKIP_RESTORE}

  client:
    build:
      context: client/wfprev-war
      dockerfile: Dockerfile.local
      target: runner
    profiles:
      - dev-static
    ports:
      - "4200:8080"
    networks:
      - wfprev-network
    volumes:
      - ./docker/login-mock.html:/app/dist/wfprev/login-mock.html
    depends_on:
      api-dev:
        condition: service_started
      db:
        condition: service_healthy

  client-watch:
    build:
      context: client/wfprev-war
      dockerfile: Dockerfile.local
      target: dev
    profiles:
      - dev
    ports:
      - "4200:8080"
    networks:
      wfprev-network:
        aliases:
          - client
    volumes:
      - ./client/wfprev-war/src/main/angular:/app
      - /app/node_modules
      - ./docker/login-mock.html:/app/src/login-mock.html
    depends_on:
      api-dev:
        condition: service_started
      db:
        condition: service_healthy